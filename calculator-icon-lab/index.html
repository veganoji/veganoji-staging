<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>電卓アイコン 5案 | ビーガン王子</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/crown-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#FFF9EE;--white:#FFFDF8;--cream:#FDF1DA;--line:#EADCC0;--ink:#1F1812;--ink-soft:#3C2E22;--muted:#786148;--leaf:#3F6A3A;--royal:#C9223A;
    --round:"Zen Maru Gothic","Noto Sans JP",sans-serif;--sans:"Noto Sans JP",sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:120px}
  main{max-width:1060px;margin:0 auto;padding:30px 16px}
  h1{font:900 30px/1.3 var(--round);text-align:center;margin:0}
  .intro{text-align:center;color:var(--ink-soft);font-size:15px;margin:10px auto 26px;max-width:560px}
  .sets{display:grid;gap:24px}
  .set{background:var(--white);border:2.5px solid var(--ink);border-radius:26px;box-shadow:5px 5px 0 var(--ink);padding:20px 16px 18px}
  .set[data-picked="true"]{box-shadow:5px 5px 0 var(--leaf);border-color:var(--leaf);background:#F3F8EE}
  .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sh b{font:900 22px var(--round)} .sh span{font-size:14px;color:var(--muted)}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .ic{position:relative;border:2px solid transparent;border-radius:18px;background:none;padding:6px 2px 4px;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  .ic img{width:100%;max-width:120px;aspect-ratio:1;display:block;margin:0 auto;transition:transform .15s}
  .ic:active img{transform:scale(.94)}
  .ic .l{display:block;font:700 13px var(--sans);color:var(--muted);text-align:center;margin-top:2px}
  .ic .h{position:absolute;top:2px;right:4px;font-size:18px;line-height:1;opacity:.28;transition:opacity .15s,transform .15s}
  .ic[aria-pressed="true"]{border-color:var(--royal);background:#FDF0F2}
  .ic[aria-pressed="true"] .h{opacity:1;transform:scale(1.15)}
  .ctx{margin-top:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:12px 10px 8px}
  .ctx-t{font:700 12px var(--sans);color:var(--muted);margin:0 0 8px 4px}
  .mini{display:flex;align-items:center;gap:14px;padding:6px 6px}
  .mini + .mini{border-top:1.5px solid var(--line)}
  .mini figure{margin:0;width:64px;text-align:center;flex:none}
  .mini figure img{width:54px;height:54px;display:block;margin:0 auto}
  .mini figcaption{font:700 12px var(--sans);color:var(--muted)}
  .mini .n{font:900 32px/1.1 var(--round);color:var(--leaf)} .mini .n small{font-size:16px;margin-left:3px}
  .pick{display:block;width:100%;margin-top:14px;height:50px;border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);background:var(--white);font:900 16px var(--round);cursor:pointer;color:var(--ink)}
  .pick:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .set[data-picked="true"] .pick{background:var(--leaf);color:#fff}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--paper);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .bar p{margin:0;flex:1;font:700 14px/1.5 var(--sans);min-width:0}
  .bar button{flex:none;height:44px;padding:0 18px;border-radius:14px;border:2.5px solid var(--paper);background:#E8C76F;color:var(--ink);font:900 15px var(--round);cursor:pointer}
  @media (min-width:900px){.sets{grid-template-columns:1fr 1fr}.set:last-child{grid-column:1/-1;max-width:520px;justify-self:center;width:100%}}
</style>
</head>
<body>
<main>
  <h1>ビーガン電卓・アイコン5案</h1>
  <p class="intro">気に入ったアイコンを <b>♡タップ</b>（いくつでもOK・セットをまたいでもOK）。1セットまるごとなら「このセットに決める」。下の「えらんだもの」をコピーして送ってね。</p>
  <div class="sets" id="sets"></div>
</main>
<div class="bar"><div class="bar-in"><p id="sum">まだ選んでいません</p><button type="button" id="copy">コピー</button></div></div>
<script>
(function(){
  var SETS = [
    ['A','水彩','ふんわり透ける水彩。空の背景となじむ、いちばん穏やか。'],
    ['B','ステッカー','太めのフチ＋白いステッカー縁。ボタンや王子の線画と同じ“チビシール”系。'],
    ['C','にこにこ','ぜんぶに小さな顔。やさしいパステル、いちばんキャラっぽい。'],
    ['D','絵本','色えんぴつとクレヨンの手描き感。あたたかい絵本のタッチ。'],
    ['E','王子','ぜんぶが小さな王冠＋王子のマント（赤×金）。“王子の電卓”らしさ満点。']
  ];
  var KEYS = [['water','水','152万','L'],['grain','穀物','6,607','kg'],['forest','森林','1,022','㎡'],['co2','CO₂','3,322','kg'],['animal','いのち','365','']];
  var st; try { st = JSON.parse(localStorage.getItem('calcIconLab')) || {}; } catch(e){ st = {}; }
  st.fav = st.fav || {}; st.set = st.set || '';
  function save(){ try { localStorage.setItem('calcIconLab', JSON.stringify(st)); } catch(e){} render(); }
  var host = document.getElementById('sets');
  host.innerHTML = SETS.map(function(s){
    var icons = KEYS.map(function(k){ return '<button type="button" class="ic" data-id="'+s[0]+'-'+k[0]+'" aria-pressed="false"><span class="h">♥</span><img src="img/'+s[0]+'-'+k[0]+'.webp" alt="'+k[1]+'" loading="lazy" /><span class="l">'+k[1]+'</span></button>'; }).join('');
    var ctx = [KEYS[0],KEYS[2],KEYS[4]].map(function(k){ return '<div class="mini"><figure><img src="img/'+s[0]+'-'+k[0]+'.webp" alt="" loading="lazy" /><figcaption>'+k[1]+'</figcaption></figure><div class="n">'+k[2]+(k[3]?'<small>'+k[3]+'</small>':'')+'</div></div>'; }).join('');
    return '<section class="set" data-set="'+s[0]+'"><div class="sh"><b>'+s[0]+'　'+s[1]+'</b><span>'+s[2]+'</span></div><div class="row">'+icons+'</div><div class="ctx"><p class="ctx-t">実際の大きさ（電卓の中）</p>'+ctx+'</div><button type="button" class="pick" data-pick="'+s[0]+'">このセットに決める</button></section>';
  }).join('');
  host.addEventListener('click', function(e){
    var ic = e.target.closest('.ic'), pk = e.target.closest('.pick');
    if (ic){ var id = ic.dataset.id; if (st.fav[id]) delete st.fav[id]; else st.fav[id] = 1; save(); }
    if (pk){ st.set = st.set === pk.dataset.pick ? '' : pk.dataset.pick; save(); }
  });
  function label(id){ var p = id.split('-'); var k = KEYS.filter(function(x){ return x[0] === p[1]; })[0]; return p[0]+'の'+k[1]; }
  function summary(){
    var favs = Object.keys(st.fav);
    var a = [];
    if (st.set) a.push('セット'+st.set+'に決定');
    if (favs.length) a.push('♡ '+favs.map(label).join('・'));
    return a.length ? a.join(' ／ ') : '';
  }
  function render(){
    document.querySelectorAll('.ic').forEach(function(b){ b.setAttribute('aria-pressed', String(!!st.fav[b.dataset.id])); });
    document.querySelectorAll('.set').forEach(function(s){ s.setAttribute('data-picked', String(st.set === s.dataset.set)); });
    document.querySelectorAll('.pick').forEach(function(b){ b.textContent = st.set === b.dataset.pick ? '✓ このセットに決定' : 'このセットに決める'; });
    document.getElementById('sum').textContent = summary() || 'まだ選んでいません';
  }
  document.getElementById('copy').addEventListener('click', function(){
    var txt = '電卓アイコン: ' + (summary() || '未選択'), b = this;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){ b.textContent = 'コピーした！'; setTimeout(function(){ b.textContent = 'コピー'; }, 1600); })
      .catch(function(){ prompt('コピーしてね', txt); });
  });
  render();
})();
</script>
</body>
</html>
