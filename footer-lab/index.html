<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" /><title>フッター案 · つぎは、どこへ？ | ビーガン王子</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
body{margin:0;background:#F4EAD6;font-family:"Noto Sans JP",sans-serif;color:#1F1812}
.top{max-width:980px;margin:0 auto;padding:28px 18px 8px;text-align:center}
.top h1{font-size:24px;font-weight:900;margin:0 0 8px}
.top p{font-size:14px;line-height:1.8;color:#3C2E22;margin:0 auto;max-width:620px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;padding:12px;background:#F4EAD6ee;backdrop-filter:blur(6px)}
.tabs button{font:900 14px "Noto Sans JP";padding:9px 14px;border:2.5px solid #1F1812;border-radius:999px;background:#FFFDF8;box-shadow:3px 3px 0 #1F1812;cursor:pointer}
.tabs button[aria-pressed=true]{background:#3F6A3A;color:#fff}
.grid{max-width:1900px;margin:0 auto;padding:10px 18px 60px;display:grid;gap:34px;justify-items:center}
.v{width:100%;max-width:440px}
.v h2{font-size:17px;font-weight:900;margin:0 0 4px;text-align:center}
.v .d{font-size:13px;line-height:1.7;color:#786148;text-align:center;margin:0 0 14px;min-height:44px}
.v .rec{display:inline-block;background:#C9223A;color:#fff;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:2px}
@media (max-width:899px){ .v{display:none} .v[data-on=true]{display:block} }
@media (min-width:900px){ .tabs{display:none} .grid{grid-template-columns:repeat(4,minmax(0,440px));justify-content:center;align-items:start} }

  .ojf-card{box-sizing:border-box;max-width:440px;margin:0 auto;
    font-family:"Noto Sans JP",sans-serif;color:#1F1812;text-align:left;
    background:#FFF9EE;border:3px solid #1F1812;border-radius:28px;
    box-shadow:7px 7px 0 #1F1812;padding:24px 18px 26px;}
  .ojf-card *{box-sizing:border-box;}
  .ojf-h{text-align:center;font-size:22px;font-weight:900;margin:0 0 14px;}
  .ojf-social{display:flex;justify-content:center;gap:14px;margin-bottom:20px;}
  .ojf-social a{display:block;transition:transform .15s ease;}
  .ojf-social a:hover{transform:translateY(-3px) scale(1.08);}
  .ojf-social img{width:42px;height:42px;object-fit:contain;display:block;}
  .ojf-btn{display:flex;align-items:center;gap:14px;width:100%;border:2.5px solid #1F1812;
    border-radius:18px;box-shadow:4px 4px 0 #1F1812;padding:14px 18px;text-decoration:none;color:#fff;
    margin-bottom:13px;font-weight:900;font-size:17px;
    transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;}
  .ojf-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #1F1812;filter:brightness(1.06) saturate(1.05);}
  .ojf-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #1F1812;}
  .ojf-btn img{width:46px;height:46px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));}
  .ojf-btn .ojf-ar{margin-left:auto;font-size:19px;opacity:.9;}
  .ojf-recipe{background:linear-gradient(135deg,#86AD79,#3F6A3A);}
  .ojf-map{background:linear-gradient(135deg,#E8C76F,#B98F2E);}
  .ojf-vegfit{background:linear-gradient(135deg,#A3C49A,#5C8451);}
  .ojf-sectitle{text-align:center;font-size:18px;font-weight:900;color:#1F1812;margin:14px 0 12px;}
  .ojf-tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:6px;}
  .ojf-tri a{display:flex;flex-direction:column;align-items:center;gap:6px;border:2.5px solid #1F1812;
    border-radius:16px;box-shadow:3px 3px 0 #1F1812;padding:14px 4px 12px;text-decoration:none;color:#fff;
    transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;}
  .ojf-tri a:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #1F1812;filter:brightness(1.07);}
  .ojf-tri a:active{transform:translate(3px,3px);box-shadow:0 0 0 #1F1812;}
  .ojf-tri img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));}
  .ojf-tri .ojf-t{font-size:14px;font-weight:900;}
  .ojf-tri .ojf-g{font-size:9px;font-weight:700;letter-spacing:.12em;opacity:.8;}
  .ojf-earth{background:linear-gradient(135deg,#86AD79,#3F6A3A);}
  .ojf-ocean{background:linear-gradient(135deg,#5AA0CE,#1B5C8B);}
  .ojf-body{background:linear-gradient(135deg,#E5728A,#9C1428);}
  .ojf-duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px;}
  .ojf-duo .ojf-btn{margin-bottom:0;font-size:15px;gap:9px;padding:13px 12px;}
  .ojf-duo .ojf-btn img{width:38px;height:38px;}
  .ojf-news{background:linear-gradient(135deg,#9477B5,#574277);}
  .ojf-report{background:linear-gradient(135deg,#E0915A,#C9532C);}
  /* newsletter */
  .ojf-nl{background:#FDF1DA;border:2.5px solid #1F1812;border-radius:18px;
    box-shadow:4px 4px 0 #1F1812;padding:15px 16px;margin-bottom:13px;}
  .ojf-nl-lbl{display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:900;color:#1F1812;margin-bottom:11px;}
  .ojf-nl-lbl img{width:26px;height:26px;object-fit:contain;}
  .ojf-nl form{display:flex;gap:8px;}
  .ojf-nl input{flex:1;min-width:0;border:2px solid #1F1812;border-radius:12px;padding:11px 13px;
    font-family:inherit;font-size:14px;background:#fff;color:#1F1812;}
  .ojf-nl input:focus{outline:none;box-shadow:0 0 0 3px rgba(108,149,96,.3);}
  .ojf-nl button{border:2.5px solid #1F1812;border-radius:12px;background:linear-gradient(135deg,#86AD79,#3F6A3A);
    color:#fff;font-family:inherit;font-weight:900;font-size:14px;padding:0 18px;cursor:pointer;white-space:nowrap;
    box-shadow:3px 3px 0 #1F1812;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;}
  .ojf-nl button:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #1F1812;filter:brightness(1.06);}
  .ojf-nl button:active{transform:translate(3px,3px);box-shadow:0 0 0 #1F1812;}
  .ojf-nl-done{text-align:center;font-weight:900;color:#3F6A3A;padding:6px 0;}
  /* support + stripe tiers */
  .ojf-support{background:linear-gradient(135deg,#FBE9EB,#F7D7DC);border:2.5px solid #1F1812;border-radius:18px;
    box-shadow:4px 4px 0 #1F1812;padding:15px 16px;margin-bottom:0;}
  .ojf-support-head{display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:900;color:#9C1428;margin-bottom:11px;}
  .ojf-support-head img{width:34px;height:34px;object-fit:contain;}
  .ojf-tiers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
  .ojf-tier{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:#fff;border:2.5px solid #1F1812;border-radius:14px;box-shadow:3px 3px 0 #9C1428;
    padding:11px 4px;text-decoration:none;color:#9C1428;
    transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;}
  .ojf-tier:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #9C1428;filter:brightness(1.02);}
  .ojf-tier:active{transform:translate(3px,3px);box-shadow:0 0 0 #9C1428;}
  .ojf-tier b{font-size:19px;font-weight:900;line-height:1;}
  .ojf-tier span{font-size:10px;font-weight:700;color:#786148;}
  
  .ojf-tools a:nth-child(1){background:linear-gradient(135deg,#E8C76F,#B98F2E);}
  .ojf-tools a:nth-child(2){background:linear-gradient(135deg,#F09A8E,#C9223A);}
  .ojf-tools a:nth-child(3){background:linear-gradient(135deg,#72BDB0,#2E7D6F);}
  .ojf-hub{background:linear-gradient(135deg,#E8C76F,#B98F2E);}
  .ojf-hub small{display:block;font-size:11px;font-weight:700;opacity:.9;margin-top:1px;}
  .ojf-quiz{background:linear-gradient(135deg,#F09A8E,#C9223A);}
  .ojf-calc{background:linear-gradient(135deg,#72BDB0,#2E7D6F);}

</style></head><body>
<div class="top"><h1>「つぎは、どこへ？」フッター案</h1>
<p>全ページ下部の共通カード。クイズと電卓を足しつつ、<b>カードを長くしない</b>ための3案です（タップでも実際に遷移します）。スマホは上のボタンで切替、PCは4つ並べて比較。</p></div>
<div class="tabs" id="tabs"><button data-v="now">いまの</button><button data-v="A" aria-pressed="true">A案</button><button data-v="B">B案</button><button data-v="C">C案</button></div>
<div class="grid" id="grid"></div>
<script>
var SOC='<div class="ojf-social"><a><img src="/images/social/ig.png" alt=""></a><a><img src="/images/social/x.png" alt=""></a><a><img src="/images/social/yt.png" alt=""></a><a><img src="/images/social/tt.png" alt=""></a><a><img src="/images/social/li.png" alt=""></a></div>';
var RECIPE='<a class="ojf-btn ojf-recipe" href="/recipes/"><img src="/images/vegan-to-chikyu/food-onigiri.png" alt="">美味しいレシピ<span class="ojf-ar">→</span></a>';
var MAP='<a class="ojf-btn ojf-map" href="https://veganmapjapan.org" target="_blank" rel="noopener"><img src="/images/mascot/map-japan.png" alt="">全国のビーガンマップ<span class="ojf-ar">→</span></a>';
var WHY='<div class="ojf-sectitle">なぜビーガン？</div><div class="ojf-tri"><a class="ojf-earth" href="/vegan-and-earth/"><img src="/images/vegan-to-chikyu/icon-globe-earth.png" alt=""><span class="ojf-t">地球</span><span class="ojf-g">PLANET</span></a><a class="ojf-ocean" href="/fish-and-life/"><img src="/images/vegan-to-chikyu/icon-fish-eyed.png" alt=""><span class="ojf-t">海</span><span class="ojf-g">OCEAN</span></a><a class="ojf-body" href="/vegan-and-health/"><img src="/images/vegan-to-chikyu/icon-heart.png" alt=""><span class="ojf-t">体</span><span class="ojf-g">BODY</span></a></div>';
var OTHER='<div class="ojf-sectitle">その他</div><a class="ojf-btn ojf-vegfit" href="/vegfit/"><img src="/images/vegfit/logo-icon.png" alt="">ベジトレClubに参加<span class="ojf-ar">→</span></a><div class="ojf-duo"><a class="ojf-btn ojf-news" href="/blog/"><img src="/images/oji/oji_writing.png" alt="">ベジー<wbr>ニュース</a><a class="ojf-btn ojf-report" href="/activity/"><img src="/images/oji/oji_presenting.png" alt="">活動報告</a></div>';
var NL='<div class="ojf-nl"><div class="ojf-nl-lbl"><img src="/images/vegan-to-chikyu/icon-leaf-vegan.png" alt="">ビーガン王子通信に購読</div><form onsubmit="return false"><input type="email" placeholder="メールアドレス"><button type="button">登録</button></form></div>';
var SUP='<div class="ojf-support"><div class="ojf-support-head"><img src="/images/oji/oji_greeting.png" alt="">王子の活動を支援する</div><div class="ojf-tiers"><a class="ojf-tier"><b>¥500</b><span>/月</span></a><a class="ojf-tier"><b>¥1,000</b><span>/月</span></a><a class="ojf-tier"><b>¥2,000</b><span>/月</span></a></div></div>';
var TOOLS3='<div class="ojf-sectitle">王子のツール</div><div class="ojf-tri ojf-tools"><a href="https://veganmapjapan.org" target="_blank" rel="noopener"><img src="/images/tools/map-japan.webp" alt=""><span class="ojf-t">マップ</span><span class="ojf-g">MAP</span></a><a href="/quiz/"><img src="/images/tools/oji-questioning.webp" alt=""><span class="ojf-t">クイズ</span><span class="ojf-g">QUIZ</span></a><a href="/calculator/"><img src="/images/tools/oji-happy.webp" alt=""><span class="ojf-t">電卓</span><span class="ojf-g">CALC</span></a></div>';
var HUB='<a class="ojf-btn ojf-hub" href="/tools/"><img src="/images/mascot/map-japan.png" alt=""><span>王子のツール<small>マップ・クイズ・ビーガン電卓</small></span><span class="ojf-ar">→</span></a>';
var DUO2='<div class="ojf-duo"><a class="ojf-btn ojf-quiz" href="/quiz/"><img src="/images/tools/oji-questioning.webp" alt="">クイズ</a><a class="ojf-btn ojf-calc" href="/calculator/"><img src="/images/tools/oji-happy.webp" alt="">ビーガン電卓</a></div>';
function card(mid){ return '<div class="ojf-card"><div class="ojf-h">つぎは、どこへ？</div>'+SOC+RECIPE+mid+WHY+OTHER+NL+SUP+'</div>'; }
var V=[
 {k:'now',t:'いまの',d:'現在のカード（クイズ・電卓なし）。',mid:MAP},
 {k:'A',t:'A案 ─ 「王子のツール」3タイル',rec:1,d:'マップのボタンを、なぜビーガン？と同じ3タイル（マップ／クイズ／電卓）に置き換え。<b>行数が増えない</b>のに2つ増える。',mid:TOOLS3},
 {k:'B',t:'B案 ─ ハブへの1ボタン',d:'マップのボタンを「王子のツール」1つに。/tools/ にまとめて案内。<b>いちばんシンプル</b>、ただしマップは1タップ遠くなる。',mid:HUB},
 {k:'C',t:'C案 ─ マップ＋2つ並び',d:'マップはそのまま、その下にクイズ／電卓を小さめ2つ並びで追加。いちばん目立つが、<b>1行ぶん長くなる</b>。',mid:MAP+DUO2}
];
var g=document.getElementById('grid');
g.innerHTML=V.map(function(v){return '<section class="v" data-k="'+v.k+'" data-on="'+(v.k==='A')+'"><h2>'+v.t+(v.rec?'<span class="rec">おすすめ</span>':'')+'</h2><p class="d">'+v.d+'</p>'+card(v.mid)+'</section>';}).join('');
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
 g.querySelectorAll('.v').forEach(function(s){s.setAttribute('data-on',s.dataset.k===b.dataset.v)});});
</script></body></html>
