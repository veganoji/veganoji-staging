<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>王子のツール — ビーガン電卓・クイズ・ビーガンマップ | ビーガン王子</title>
  <meta name="description" content="ビーガン王子の無料ツール。ビーガン電卓、ごはんと地球のクイズ、日本ビーガンマップ——遊んで、調べて、ビーガンをもっと身近に。" />
  <link rel="canonical" href="https://veganoji.jp/tools/" />
  <meta name="theme-color" content="#FFF9EE" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://veganoji.jp/tools/" />
  <meta property="og:site_name" content="ビーガン王子 Vegan Oji" />
  <meta property="og:title" content="王子のツール — ビーガン電卓・クイズ・ビーガンマップ" />
  <meta property="og:description" content="遊んで、調べて、ビーガンをもっと身近に。ビーガン王子の無料ツール🌏" />
  <meta property="og:image" content="https://veganoji.jp/images/tools/og-calculator.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/crown-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/crown-180.png" />
  <link rel="preload" as="image" href="/images/tools/sky-earth.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/mnav.css" />
  <style>
    :root{
      --paper:#FFF9EE; --white:#FFFDF8; --ink:#1F1812; --ink-soft:#3C2E22; --muted:#786148;
      --royal:#C9223A; --round:"Zen Maru Gothic","Noto Sans JP",sans-serif; --sans:"Noto Sans JP",sans-serif;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0; background:var(--paper); color:var(--ink); font:500 16px/1.7 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden}
    img{display:block; max-width:100%}
    .sky{height:clamp(210px,34vh,320px); background:#F6E9B8 url('/images/tools/sky-earth.webp') center 14%/cover no-repeat; position:relative}
    .sky::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,249,238,0) 50%,var(--paper) 100%)}
    main{max-width:480px; margin:0 auto; padding:0 18px}
    .head{position:relative; z-index:1; margin-top:-58px; text-align:center}
    h1{font:900 46px/1.15 var(--round); letter-spacing:.05em; margin:0}
    h1 em{font-style:normal; color:var(--royal)}
    .lead{font-size:17px; color:var(--ink-soft); margin:10px 0 0}
    .tools{display:grid; gap:18px; margin:32px 0 0; padding:0; list-style:none}
    .tool{display:flex; align-items:center; gap:14px; padding:16px 18px 16px 12px; background:var(--white); color:var(--ink); text-decoration:none; border:2.5px solid var(--ink); border-radius:26px; box-shadow:5px 5px 0 var(--ink); transition:transform .12s, box-shadow .12s}
    .tool:hover{transform:translate(2px,2px); box-shadow:3px 3px 0 var(--ink)}
    .tool:active{transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink)}
    .tool img{width:80px; height:96px; object-fit:contain; flex:none}
    .tool h2{font:900 20px/1.35 var(--round); margin:0; line-break:strict}
    .tool p{font-size:15px; line-height:1.6; color:var(--muted); margin:4px 0 0}
    .tool .go{display:none; font:900 24px/1 var(--round); color:var(--royal)}
    .foot{padding:56px 18px 64px}
    .foot > div{max-width:560px; margin:0 auto}
    @media (min-width:760px){
      .sky{max-width:880px; margin:0 auto; border-radius:0 0 48px 48px; height:360px; background-position:center 18%}
      .sky::after{border-radius:0 0 48px 48px}
      h1{font-size:54px}
      main{max-width:980px}
      .tools{grid-template-columns:repeat(3,1fr); gap:24px; margin-top:40px}
      .tool{flex-direction:column; text-align:center; padding:28px 22px 24px; gap:14px}
      .tool img{width:120px; height:140px}
      .tool .go{display:block; margin:auto 0 0}
    }
    @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
  </style>
</head>
<body>

  <button id="mnav-open" type="button" class="mnav-burger mnav-float" aria-label="メニューを開く" aria-expanded="false" aria-controls="mnav-sheet">
    <svg width="22" height="22" viewBox="0 0 22 22"><g stroke="#1F1812" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"/><line x1="3" y1="11" x2="19" y2="11"/><line x1="3" y1="16" x2="19" y2="16"/></g></svg>
  </button>

  <div class="sky" role="presentation"></div>

  <main>
    <header class="head">
      <h1>王子の<em>ツール</em></h1>
      <p class="lead">遊んで、調べて、ビーガンをもっと身近に。</p>
    </header>

    <ul class="tools">
      <li>
        <a class="tool" href="/calculator/">
          <img src="/images/tools/oji-happy.webp" alt="" width="88" height="104" />
          <div><h2>ビーガン電卓</h2><p>続けたら、地球はどう変わる？</p></div>
          <span class="go" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="tool" href="/quiz/">
          <img src="/images/tools/oji-questioning.webp" alt="" width="88" height="104" />
          <div><h2>ごはんと地球のクイズ</h2><p>全10問。きみは何問わかる？</p></div>
          <span class="go" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="tool" href="https://veganmapjapan.org" target="_blank" rel="noopener">
          <img src="/images/tools/map-japan.webp" alt="" width="88" height="104" />
          <div><h2>日本ビーガンマップ</h2><p>全国のビーガン店を、<br />地図でまるごと。</p></div>
          <span class="go" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>
  </main>

  <div class="foot"><div id="oji-footer-nav"></div></div>

  <script src="/mnav.js" defer></script>
  <script src="/oji-footer.js" defer></script>
</body>
</html>
