  <style>
    :root{
      --paper:#FFF9EE; --white:#FFFDF8; --cream:#FDF1DA; --line:#EADCC0; --gold:#E8C76F;
      --ink:#1F1812; --ink-soft:#3C2E22; --muted:#786148;
      --leaf-deep:#3F6A3A; --royal:#C9223A; --royal-deep:#9C1428; --night:#13213F;
      --round:"Zen Maru Gothic","Noto Sans JP",sans-serif; --sans:"Noto Sans JP",sans-serif;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%; background:#FFF9EE}
    body{margin:0; background:transparent; color:var(--ink); font:500 16px/1.7 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden}
    button{font:inherit; color:inherit; -webkit-tap-highlight-color:transparent}
    img{display:block; max-width:100%}
    .col{max-width:480px; margin:0 auto; padding:0 18px}

    /* ── hero: layered watercolor (sky · clouds · Earth · hills) ── */
    .art{position:relative; height:clamp(240px,36vh,340px); overflow:hidden; background:#F7E4A6 url('/images/tools/hero-sky.webp') center/cover no-repeat}
    .art{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 72px),transparent); mask-image:linear-gradient(180deg,#000 calc(100% - 72px),transparent)}
    .page-bg{position:fixed; inset:0; z-index:-1; pointer-events:none; background:#FFF9EE url('/images/tools/page-wash-portrait.webp') center/cover no-repeat}
    @media (min-aspect-ratio:1/1){ .page-bg{background-image:url('/images/tools/page-wash-landscape.webp')} }
    .earth{position:absolute; left:50%; top:9%; width:clamp(140px,40vw,232px); z-index:1; animation:bob 6s ease-in-out infinite}
    .cl{position:absolute; z-index:2; pointer-events:none}
    .c1{width:clamp(110px,28vw,230px); top:14%; left:-3%; animation:drift 24s ease-in-out infinite alternate}
    .c2{width:clamp(150px,38vw,340px); top:46%; right:-6%; animation:drift 30s ease-in-out infinite alternate-reverse}
    .c3{width:clamp(70px,18vw,150px); top:5%; right:12%; opacity:.85; animation:drift 20s ease-in-out infinite alternate}
    .hills{position:absolute; left:0; right:0; bottom:0; height:clamp(64px,12vw,150px); z-index:3; background:url('/images/tools/hero-hills.webp') center bottom/auto 100% repeat-x}
    @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-9px)}}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(36px)}}
    .head{text-align:center; margin-top:-6px; position:relative; z-index:5}
    h1{font:900 46px/1.15 var(--round); letter-spacing:.05em; margin:0}
    h1 em{font-style:normal; color:var(--royal)}
    .lead{font-size:17px; line-height:1.75; color:var(--ink-soft); margin:8px 0 0}

    /* ── picker ── */
    .pick{margin-top:24px; text-align:center}
    .seg{display:grid; grid-template-columns:repeat(5,1fr); gap:7px}
    .seg button{height:54px; padding:0; cursor:pointer; font:900 17px var(--round); background:var(--white); border:2.5px solid var(--ink); border-radius:16px; box-shadow:3px 3px 0 var(--ink); transition:transform .12s, box-shadow .12s, background .15s, color .15s}
    .seg button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
    .seg button[aria-pressed="true"]{background:var(--leaf-deep); color:#fff}
    .stepper{display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:5px; background:var(--white); border:2.5px solid var(--ink); border-radius:999px; box-shadow:3px 3px 0 var(--ink)}
    .stepper button{width:44px; height:44px; flex:none; cursor:pointer; border-radius:50%; border:2px solid var(--ink); background:var(--gold); font:900 24px/1 var(--round); display:grid; place-items:center; transition:transform .12s, opacity .15s}
    .stepper button:active{transform:scale(.9)}
    .stepper button:disabled{opacity:.3; cursor:default}
    .stepper output{min-width:118px; height:44px; padding:0 14px; border-radius:999px; background:var(--leaf-deep); color:#fff; font:900 21px/44px var(--round); text-align:center}

    /* ── results ── */
    .res{margin-top:30px}
    .k{font:700 17px var(--sans); color:var(--leaf-deep); text-align:center; margin:0}
    .h{font:900 32px/1.35 var(--round); text-align:center; margin:2px 0 14px}
    .h em{font-style:normal; color:var(--royal)}
    .list{background:var(--white); border:2.5px solid var(--ink); border-radius:26px; box-shadow:5px 5px 0 var(--ink); overflow:hidden}
    .row{position:relative; display:flex; align-items:center; gap:9px; padding:14px 20px 14px 10px}
    .row + .row{border-top:1.5px solid var(--line)}
    .row::before{content:""; position:absolute; inset:4px 0; background:var(--band) center/100% 100% no-repeat; opacity:.45; pointer-events:none}
    .row[data-k="water"]{--band:url('/images/tools/band-water.webp'); --c:#2A6BA0}
    .row[data-k="grain"]{--band:url('/images/tools/band-grain.webp'); --c:#9A6A12}
    .row[data-k="forest"]{--band:url('/images/tools/band-forest.webp'); --c:#3F6A3A}
    .row[data-k="co2"]{--band:url('/images/tools/band-co2.webp'); --c:#4F5B67}
    .row[data-k="animal"]{--band:url('/images/tools/band-animal.webp'); --c:#B0445E}
    .ico{position:relative; margin:0; width:66px; flex:none; text-align:center}
    .ico .wash{position:absolute; left:50%; top:30px; width:80px; height:80px; transform:translate(-50%,-50%); opacity:.6; pointer-events:none; transition:opacity .5s}
    .row.cleared .wash{opacity:.95}
    .ico .i{position:relative; width:56px; height:56px; margin:0 auto; filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(1px 4px 3px rgba(31,24,18,.25))}
    .ico figcaption{position:relative; font:700 13px/1.3 var(--sans); color:var(--muted); margin-top:3px; white-space:nowrap}
    .row.pulse .wash{animation:pulse .6s ease}
    @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.14)}}
    .val{position:relative; flex:1; min-width:0; text-align:center}
    .num{font:900 38px/1.1 var(--round); color:var(--c, var(--leaf-deep)); font-variant-numeric:tabular-nums; white-space:nowrap}
    .num .u{font-size:18px; margin-left:4px}
    .eq{font:500 12.5px/1.5 var(--sans); color:#5A4631}
    .eq span{display:inline-block}
    .why-btn{position:relative; flex:none; min-width:56px; height:36px; padding:0 6px; cursor:pointer; border-radius:999px; border:2px solid var(--ink); background:var(--cream); box-shadow:2px 2px 0 var(--ink); font:900 14px/1 var(--round); color:var(--royal); display:grid; place-items:center; transition:box-shadow .12s}
    .why-btn:active{box-shadow:0 0 0 var(--ink)}
    .why-btn:not(.done){animation:hop 2.6s ease-in-out infinite; animation-delay:var(--d, 0s)}
    @keyframes hop{0%,62%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-9px) scale(1.04,.96)}76%{transform:translateY(0) scale(1.1,.88)}82%{transform:translateY(-3px) scale(.97,1.03)}88%{transform:translateY(0) scale(1)}}
    .why-btn.done{background:var(--leaf-deep); color:#fff; animation:pop .45s cubic-bezier(.2,.9,.3,1.5)}
    @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
    .quest{margin-top:16px; padding:11px 14px; background:var(--white); border:2px dashed #D9C79E; border-radius:18px; cursor:pointer; -webkit-tap-highlight-color:transparent}
    .quest.done{cursor:default}
    .q-play{display:flex; align-items:center; gap:10px}
    .q-play .qt{font:900 14px/1.3 var(--round); color:var(--ink-soft)}
    .slots{display:flex; gap:5px; margin-left:auto}
    .slots img{width:30px; height:30px; filter:grayscale(1) opacity(.35); transition:filter .5s, transform .5s}
    .slots img.on{filter:none; transform:scale(1.12)}
    .qc{font:900 15px var(--round); color:var(--leaf-deep); min-width:34px; text-align:right}
    .q-done{display:none; align-items:center; gap:12px}
    .q-done img{width:62px; height:auto; flex:none; animation:bob2 3s ease-in-out infinite}
    .q-done b{display:block; font:900 18px/1.3 var(--round); color:var(--royal)}
    .q-done span{font-size:13.5px; line-height:1.6; color:var(--ink-soft)}
    .quest.done{border:2.5px solid var(--ink); box-shadow:3px 3px 0 var(--ink); background:linear-gradient(135deg,#FFF7DC,#FCEBC3)}
    .quest.done .q-play{display:none} .quest.done .q-done{display:flex}
    @keyframes bob2{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
    .confetti{position:fixed; inset:0; pointer-events:none; z-index:95; overflow:hidden}
    .confetti i{position:absolute; top:-14px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
    @keyframes fall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}

    /* ── oji reaction ── */
    .oji{display:flex; align-items:flex-end; justify-content:center; gap:8px; margin-top:26px}
    .bubble{position:relative; flex:1; max-width:250px; margin:0 0 46px; padding:14px 16px; background:var(--white); border:2.5px solid var(--ink); border-radius:20px; box-shadow:3px 3px 0 var(--ink); font:700 16px/1.7 var(--round)}
    .bubble::after{content:""; position:absolute; right:-12px; bottom:20px; width:20px; height:20px; background:var(--white); border:2.5px solid var(--ink); border-left:0; border-bottom:0; transform:rotate(45deg)}
    .oji img{width:128px; height:auto; flex:none; transition:opacity .18s}

    /* ── share ── */
    .share{margin-top:24px; text-align:center}
    .btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; cursor:pointer; text-decoration:none; color:var(--ink); background:var(--white); border:2.5px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); font:900 16px var(--round); height:54px; transition:transform .12s, box-shadow .12s, background .15s}
    .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
    .btn img{width:32px; height:32px; margin:-4px 0}
    .btn-main{height:62px; font-size:19px; background:var(--royal); color:var(--paper)}
    .btn-main:hover{background:var(--royal-deep)}
    .btn-main[disabled]{opacity:.55}
    .pair{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
    .hint{font-size:14px; color:var(--muted); margin:14px 0 0}
    .hint b{color:var(--leaf-deep)}

    /* ── more (chibi cards) ── */
    .more{margin-top:36px; display:grid; grid-template-columns:1fr 1fr; gap:14px}
    .mcard{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px 10px 16px; background:var(--white); color:var(--ink); text-decoration:none; border:2.5px solid var(--ink); border-radius:22px; box-shadow:4px 4px 0 var(--ink); transition:transform .12s, box-shadow .12s}
    .mcard:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
    .mcard .mw{position:relative; width:96px; height:96px; display:grid; place-items:center}
    .mcard .mw .wash{position:absolute; inset:0; width:100%; height:100%; opacity:.55}
    .mcard .mw img:not(.wash){position:relative; height:92px; width:auto}
    .mcard b{font:900 16px/1.4 var(--round); margin-top:6px}
    .mcard span{font-size:13px; color:var(--muted); margin-top:2px}
    .src{font-size:11.5px; line-height:1.9; color:var(--muted); text-align:center; margin:24px 0 0}
    .src a{color:var(--muted)}

    /* ── night ending ── */
    .night{position:relative; margin-top:30px; padding:190px 18px 72px}
    .night::before{content:""; position:absolute; inset:0; background:var(--night); -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 200px); mask-image:linear-gradient(180deg,transparent 0,#000 200px)}
    .night.ready::before{background:var(--night) url('/images/tools/night.webp') 72% top/cover no-repeat}
    .sleeper{position:absolute; z-index:1; top:58px; left:50%; width:clamp(180px,52vw,280px); animation:float 5.5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-10px)}}
    .night > div{position:relative; z-index:1; max-width:560px; margin:0 auto}

    /* ── why dialog ── */
    dialog.why{width:min(440px,calc(100vw - 20px)); margin:auto auto 10px; padding:0; border:2.5px solid var(--ink); border-radius:26px; box-shadow:6px 6px 0 var(--ink); background:var(--white); color:var(--ink); overflow:hidden}
    dialog.why[open]{animation:up .3s cubic-bezier(.2,.9,.3,1.2)}
    dialog.why::backdrop{background:rgba(31,24,18,.5)}
    @keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
    .ws{position:relative; height:200px; background:#F7E4A6 center/cover no-repeat}
    .ws img{position:absolute; bottom:0; height:var(--oh,128px); width:auto; filter:drop-shadow(0 6px 10px rgba(31,24,18,.25)); animation:ojin .5s cubic-bezier(.2,.9,.3,1.3) both, sway 3.4s ease-in-out .55s infinite}
    .ws.l img{left:6px} .ws.r img{right:6px}
    @keyframes ojin{from{transform:translateY(46px); opacity:0}to{transform:none; opacity:1}}
    @keyframes sway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
    .wb{padding:18px 20px 20px}
    .wb h3{font:900 21px/1.4 var(--round); margin:0 0 10px}
    .wsay{position:relative; margin:0; padding:14px 16px; background:var(--cream); border-radius:18px; font:700 16px/1.85 var(--sans)}
    .wsay::before{content:""; position:absolute; left:28px; top:-10px; width:18px; height:18px; background:var(--cream); transform:rotate(45deg)}
    .wsrc{font-size:11.5px; color:var(--muted); margin:10px 0 0}
    .wb .btn{margin-top:16px; background:var(--leaf-deep); color:#fff}

    /* save overlay (iOS long-press fallback) */
    .ov{position:fixed; inset:0; z-index:90; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:22px; background:rgba(31,24,18,.88)}
    .ov[data-open="true"]{display:flex}
    .ov img{max-height:70vh; max-width:88vw; border-radius:18px; border:3px solid var(--paper)}
    .ov p{margin:0; color:var(--paper); font:700 16px/1.7 var(--round); text-align:center}
    .ov .btn{width:auto; padding:0 34px}

    @media (min-width:760px){
      .art{height:360px}
      h1{font-size:56px}
      .col{max-width:540px}
      dialog.why{margin:auto}
      .ws{height:240px} .ws img{height:calc(var(--oh,128px)*1.2)}
    }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <button id="mnav-open" type="button" class="mnav-burger mnav-float" aria-label="メニューを開く" aria-expanded="false" aria-controls="mnav-sheet">
    <svg width="22" height="22" viewBox="0 0 22 22"><g stroke="#1F1812" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="19" y2="6"/><line x1="3" y1="11" x2="19" y2="11"/><line x1="3" y1="16" x2="19" y2="16"/></g></svg>
  </button>

  <div class="art" aria-hidden="true">
    <img class="cl c1" src="/images/tools/hero-cloud1.webp" alt="" />

  <main class="col">
    <header class="head">

      <h3 id="why-t"></h3>
      <p class="wsay" id="why-say"></p>
      <p class="wsrc" id="why-src"></p>
      <form method="dialog"><button class="btn" id="why-ok">わかった！</button></form>
    </div>
  </dialog>

  <div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="画像を保存">
    <img id="ov-img" alt="ビーガン電卓の結果" />
    <p>画像を<b>長押し</b>して「写真に追加」で保存してね</p>
    <button type="button" class="btn" id="ov-close">とじる</button>
  </div>

  <canvas id="cv" width="1080" height="1920" hidden></canvas>

  <script>
  (function(){
    var PER_DAY = { water:4163.9, grain:18.1, forest:2.8, co2:9.1, animal:1 };
    var ROWS = [ // key, label, unit
      ['water','水','L'], ['grain','穀物','kg'], ['forest','森林','㎡'], ['co2','CO₂','kg'], ['animal','動物のいのち','']
    ];
    var WHY = {
      water:  { t:'なぜ、水が守れるの？',    pose:'explaining-2', side:'r', oh:135,   src:'出典：Water Footprint Network',
                say:'お肉をつくるには、動物の飲み水だけでなく、エサの作物を育てる水もたくさん必要なんだ。牛肉1kgで、なんとお風呂 約75杯ぶん（約15,000L）！植物を直接食べれば、ぐっと少なくてすむよ。' },
      grain:  { t:'なぜ、穀物が守れるの？',  pose:'explaining', side:'l', oh:116,     src:'出典：FAO（国連食糧農業機関）',
                say:'世界でつくられる穀物の約3分の1は、人ではなく家畜のエサになっているんだ。お肉を減らせば、そのぶんを人のごはんにまわせるよ。' },
      forest: { t:'なぜ、森が守れるの？',    pose:'teaching', side:'l', oh:132,  src:'出典：世界銀行 ほか',
                say:'牧場や、エサになる大豆・とうもろこしの畑をつくるために、森が切られているんだ。アマゾンの森林破壊の約8割は、牛の放牧が原因。お肉を減らせば、森を守れるよ。' },
      co2:    { t:'なぜ、CO₂が減るの？',     pose:'pointing-up', side:'l', oh:100, src:'出典：FAO（国連食糧農業機関）',
                say:'牛のゲップ（メタン）や、森を切ること、エサを運ぶことで、たくさんの温室効果ガスが出るんだ。畜産は世界の排出の約15%。植物中心のごはんなら、ずっと少なくてすむよ。' },
      animal: { t:'なぜ、いのちが守れるの？', pose:'welcoming', side:'r', oh:124,    src:'出典：Cowspiracy（試算）',
                say:'お肉や卵、牛乳のために、たくさんの動物が育てられているんだ。ビーガンを1日続けると、およそ1つのいのちを守れる計算。小さな選択が、ちゃんと届くよ。' }
    };
    var STEPS = [{m:1},{m:3},{m:6},{y:1},{y:2},{y:3},{y:4},{y:5},{y:6},{y:7},{y:8},{y:9},{y:10},{y:15},{y:20},{y:30},{y:40},{y:50}];
    var TIERS = [ // [minDays, pose, page line, card line]
      [0,    'happy',       '小さな一歩も、ちゃんと地球に届いてるよ🌱', '小さな一歩も、届いてるよ'],
      [90,   'excited',     'いいね！地球が変わりはじめてる…！',       '地球が変わりはじめてる！'],
      [365,  'surprised-3', 'えっ、こんなに！？王子、ちょっと感動…🥹', 'えっ、こんなに！？'],
      [1095, 'confident',   'もう立派な「地球の味方」だね！',          'もう立派な地球の味方！'],
      [3650, 'welcoming',   '殿堂入り！王子から、心からありがとう👑',   '殿堂入り！ありがとう！']
    ];
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var $ = function(id){ return document.getElementById(id); };

    // ── build rows ──
    $('list').innerHTML = ROWS.map(function(r, i){
      return '<div class="row" data-k="'+r[0]+'">'
        + '<figure class="ico"><img class="wash" src="/images/tools/wash-'+r[0]+'.webp" alt="" /><img class="i" src="/images/tools/ic-'+r[0]+'.webp" alt="" width="56" height="56" /><figcaption>'+r[1]+'</figcaption></figure>'
        + '<div class="val"><div class="num"><span data-n="'+r[0]+'">0</span>'+(r[2]?'<span class="u">'+r[2]+'</span>':'')+'</div><div class="eq" data-e="'+r[0]+'"></div></div>'
        + '<button type="button" class="why-btn" data-why="'+r[0]+'" aria-label="'+WHY[r[0]].t+'" style="--d:'+(i*.45)+'s">なぜ？</button>'
        + '</div>';
    }).join('');
    var numEl = {}, eqEl = {};
    ROWS.forEach(function(r){ numEl[r[0]] = document.querySelector('[data-n="'+r[0]+'"]'); eqEl[r[0]] = document.querySelector('[data-e="'+r[0]+'"]'); });

    function fmt(n){
      if (n >= 1e8){ var o = n/1e8; return (o>=10?Math.round(o):Math.round(o*10)/10).toLocaleString('ja-JP')+'億'; }
      if (n >= 1e4){ var w = n/1e4; return (w>=10?Math.round(w):Math.round(w*10)/10).toLocaleString('ja-JP')+'万'; }
      return Math.round(n).toLocaleString('ja-JP');
    }
    function show(k, v){ return k === 'animal' ? Math.round(v).toLocaleString('ja-JP') : fmt(v); }
    function eq(k, v){
      if (k === 'water')  return '<span>お風呂</span> <span>約'+fmt(v/200)+'杯ぶん</span>';
      if (k === 'grain')  return '<span>おにぎり</span> <span>約'+fmt(v*10)+'個ぶん</span>';
      if (k === 'forest') return v < 260 ? '<span>たたみ</span> <span>約'+fmt(v/1.62)+'枚ぶん</span>' : '<span>テニスコート</span> <span>約'+fmt(v/260)+'面ぶん</span>';
      if (k === 'co2')    return '<span>スギ 約'+fmt(Math.max(1, v/14))+'本が</span><span>1年で吸う量</span>';
      return '<span>1日に、</span><span>ひとつのいのち</span>';
    }
    // shrink a number only when it would run into the 「なぜ？」 button (long values on narrow phones)
    function fitNum(k, text){
      var el = numEl[k], box = el.parentNode, keep = el.textContent, fs = 38;
      el.textContent = text; box.style.fontSize = '';
      while (box.scrollWidth > box.clientWidth + 1 && fs > 26){ fs -= 2; box.style.fontSize = fs + 'px'; }
      el.textContent = keep;
    }
    var fitT = 0;
    window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(function(){ Object.keys(numEl).forEach(function(k){ fitNum(k, numEl[k].textContent); }); }, 150); });
    function daysOf(s){ return (s.y||0)*365 + (s.m||0)*30; }
    function labelOf(s){ return s.y ? s.y+'年' : s.m+'ヶ月'; }
    function tierOf(d){ var t = TIERS[0]; TIERS.forEach(function(x){ if (d >= x[0]) t = x; }); return t; }

    var idx = 3, cur = { water:0, grain:0, forest:0, co2:0, animal:0 }, target = {}, raf = 0, pose = 'surprised-3', shareText = '';
    var cache = {}, cardBlob = null, cardTimer = 0, openKey = null, cleared = {};
    try { (JSON.parse(localStorage.getItem('calcCleared')) || []).forEach(function(k){ if (PER_DAY[k] !== undefined) cleared[k] = 1; }); } catch(e){}

    function update(){
      var s = STEPS[idx], d = daysOf(s), label = labelOf(s);
      Object.keys(PER_DAY).forEach(function(k){ target[k] = PER_DAY[k]*d; eqEl[k].innerHTML = eq(k, target[k]); });
      $('dur').textContent = label;
      $('kicker').textContent = 'ビーガンを'+label+'続けたら';
      $('dec').disabled = idx === 0; $('inc').disabled = idx === STEPS.length-1;
      document.querySelectorAll('#seg button').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.i === idx)); });

      var t = tierOf(d);
      $('say').textContent = t[2];
      if (t[1] !== pose){
        pose = t[1]; var im = $('oji'); im.style.opacity = 0;
        setTimeout(function(){ im.onload = function(){ im.style.opacity = 1; }; im.src = '/images/tools/oji-'+pose+'.webp'; if (im.complete) im.style.opacity = 1; }, reduce ? 0 : 150);
      }

      document.querySelectorAll('.row').forEach(function(r, i){ r.classList.remove('pulse'); void r.offsetWidth; setTimeout(function(){ r.classList.add('pulse'); }, reduce ? 0 : i*60); });
      var from = Object.assign({}, cur), t0 = performance.now(), D = reduce ? 1 : 520;
      Object.keys(target).forEach(function(k){ var a = show(k, from[k]), b = show(k, target[k]); fitNum(k, a.length > b.length ? a : b); });
      cancelAnimationFrame(raf);
      (function tick(now){
        var p = Math.min(1, (now - t0)/D), e = 1 - Math.pow(1-p, 3);
        Object.keys(target).forEach(function(k){ cur[k] = from[k] + (target[k]-from[k])*e; numEl[k].textContent = show(k, cur[k]); });
        if (p < 1) raf = requestAnimationFrame(tick);
        else Object.keys(target).forEach(function(k){ fitNum(k, numEl[k].textContent); });
      })(t0);

      var url = 'https://veganoji.jp/calculator/';
      var txt = 'ビーガン電卓で計算してみたら、ビーガンを'+label+'続けると 水'+fmt(target.water)+'L・CO₂'+fmt(target.co2)+'kg を地球にやさしくできるって🌏 きみもやってみて！ #ビーガン王子';
      $('x').href = 'https://twitter.com/intent/tweet?text='+encodeURIComponent(txt)+'&url='+encodeURIComponent(url);
      $('line').href = 'https://line.me/R/share?text='+encodeURIComponent(txt+'\n'+url);
      shareText = txt+'\n'+url;
      scheduleCard();
    }

    document.querySelectorAll('#seg button').forEach(function(b){ b.addEventListener('click', function(){ idx = +b.dataset.i; update(); }); });
    $('dec').addEventListener('click', function(){ if (idx > 0){ idx--; update(); } });
    $('inc').addEventListener('click', function(){ if (idx < STEPS.length-1){ idx++; update(); } });

    // ── "なぜ？" dialog ──
    var dlg = $('why');
    $('list').addEventListener('click', function(e){
      var b = e.target.closest('.why-btn'); if (!b) return;
      var w = WHY[b.dataset.why], sc = $('why-scene'), oj = $('why-oji');
      openKey = b.dataset.why;
      sc.style.backgroundImage = "url('/images/tools/scene-"+openKey+".webp')";
      sc.className = 'ws ' + w.side; sc.style.setProperty('--oh', w.oh + 'px');
      oj.src = '/images/tools/oji-'+w.pose+'.webp';
      oj.style.animation = 'none'; void oj.offsetWidth; oj.style.animation = '';
      $('why-t').textContent = w.t; $('why-say').textContent = w.say; $('why-src').textContent = w.src;
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
    });
    dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
    $('why-ok').addEventListener('click', function(){
      if (!openKey || cleared[openKey]) return;
      cleared[openKey] = 1; saveClear(); renderQuest();
      if (Object.keys(cleared).length === ROWS.length){ confetti(); $('say').textContent = 'ぜんぶクリア！きみも地球はかせだね🎉'; scheduleCard(); }
    });

    // ── 地球はかせチャレンジ: clear all five 「？」 ──
    function saveClear(){ try { localStorage.setItem('calcCleared', JSON.stringify(Object.keys(cleared))); } catch(e){} }
    function renderQuest(){
      ROWS.forEach(function(r){
        var on = !!cleared[r[0]], row = document.querySelector('.row[data-k="'+r[0]+'"]'), b = row.querySelector('.why-btn');
        row.classList.toggle('cleared', on); b.classList.toggle('done', on); b.textContent = on ? '✓' : 'なぜ？';
      });
      document.querySelectorAll('#slots img').forEach(function(im){ im.classList.toggle('on', !!cleared[im.dataset.k]); });
      var n = Object.keys(cleared).length;
      $('qc').textContent = n + '/' + ROWS.length;
      $('quest').classList.toggle('done', n === ROWS.length);
    }
    function confetti(){
      if (reduce) return;
      var cols = ['#C9223A','#E8C76F','#3F6A3A','#2B7AB0','#F2A7B5'], box = document.createElement('div');
      box.className = 'confetti'; document.body.appendChild(box);
      for (var i = 0; i < 48; i++){
        var c = document.createElement('i');
        c.style.left = (Math.random()*100) + 'vw'; c.style.background = cols[i % cols.length];
        c.style.animationDelay = (Math.random()*.45) + 's'; c.style.animationDuration = (1.7 + Math.random()*1.3) + 's';
        c.style.setProperty('--dx', (Math.random()*140 - 70) + 'px'); c.style.setProperty('--r', (Math.random()*720 - 360) + 'deg');
        box.appendChild(c);
      }
      setTimeout(function(){ box.remove(); }, 3600);
    }
    $('slots').innerHTML = ROWS.map(function(r){ return '<img src="/images/tools/ic-'+r[0]+'.webp" alt="'+r[1]+'" data-k="'+r[0]+'" />'; }).join('');
    $('quest').addEventListener('click', function(){ var b = document.querySelector('.why-btn:not(.done)'); if (b) b.click(); });
    renderQuest();

    // ── night background: load only when near ──
    var night = $('night');
    if ('IntersectionObserver' in window){
      new IntersectionObserver(function(es, ob){ es.forEach(function(x){ if (x.isIntersecting){ night.classList.add('ready'); ob.disconnect(); } }); }, { rootMargin:'600px' }).observe(night);
    } else { night.classList.add('ready'); }

    // ── share card (1080×1920), pre-rendered so the tap can open the native share sheet ──
    function load(src){ return cache[src] || (cache[src] = new Promise(function(ok, ng){ var i = new Image(); i.onload = function(){ ok(i); }; i.onerror = ng; i.src = src; })); }
    function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
    function drawCard(){
      var s = STEPS[idx], d = daysOf(s), label = labelOf(s), t = tierOf(d), v = {};
      Object.keys(PER_DAY).forEach(function(k){ v[k] = PER_DAY[k]*d; });
      var head = 'ビーガンを'+label+'続けたら', bub = t[3];
      var fonts = document.fonts && document.fonts.load ? Promise.all([
        document.fonts.load('900 108px "Zen Maru Gothic"', '地球に、これだけ。0123456789,.万億Lkg㎡'+bub),
        document.fonts.load('700 48px "Noto Sans JP"', head+'水穀物森林CO₂動物のいのちきみも計算してみてveganoji.jp/calculator')
      ]) : Promise.resolve();
      var hero = Object.keys(cleared).length === ROWS.length;
      var imgs = [load('/images/decorations/share-bgs/diet-earth.jpg'), load('/images/tools/oji-'+t[1]+'.webp')]
        .concat(ROWS.map(function(r){ return load('/images/tools/ic-'+r[0]+'.webp'); }))
        .concat(hero ? [load('/images/tools/badge.webp')] : []);
      return Promise.all([Promise.all(imgs), fonts]).then(function(res){
        var im = res[0], bg = im[0], oji = im[1], c = $('cv').getContext('2d');
        var sc = Math.max(1080/bg.width, 1920/bg.height), bw = bg.width*sc, bh = bg.height*sc;
        c.drawImage(bg, (1080-bw)/2, 0, bw, bh);
        var g = c.createLinearGradient(0, 380, 0, 1790);
        g.addColorStop(0, 'rgba(255,249,238,0)'); g.addColorStop(.1, 'rgba(255,249,238,.9)'); g.addColorStop(.8, 'rgba(255,249,238,.88)'); g.addColorStop(.9, 'rgba(255,249,238,.3)'); g.addColorStop(1, 'rgba(255,249,238,.3)');
        c.fillStyle = g; c.fillRect(0, 380, 1080, 1410);
        if (hero){ var bd = im[2+ROWS.length], bh2 = 300, bw3 = bd.width*bh2/bd.height; c.save(); c.translate(1080-bw3/2-46, 46+bh2/2); c.rotate(.12); c.drawImage(bd, -bw3/2, -bh2/2, bw3, bh2); c.restore(); }
        c.textAlign = 'center';
        c.fillStyle = '#3F6A3A'; c.font = '700 48px "Noto Sans JP"'; c.fillText(head, 540, 530);
        c.font = '900 108px "Zen Maru Gothic"';
        var a = '地球に、', b = 'これだけ。', wa = c.measureText(a).width, wb = c.measureText(b).width, x0 = 540-(wa+wb)/2;
        c.textAlign = 'left';
        c.fillStyle = '#1F1812'; c.fillText(a, x0, 650);
        c.fillStyle = '#C9223A'; c.fillText(b, x0+wa, 650);
        var PX = 60, PY = 700, PW = 960, RH = 164, PH = RH*5;
        c.fillStyle = '#1F1812'; rr(c, PX+9, PY+9, PW, PH, 44); c.fill();
        c.fillStyle = '#FFFDF8'; rr(c, PX, PY, PW, PH, 44); c.fill();
        c.lineWidth = 6; c.strokeStyle = '#1F1812'; rr(c, PX+3, PY+3, PW-6, PH-6, 41); c.stroke();
        ROWS.forEach(function(r, i){
          var k = r[0], y = PY + i*RH;
          if (i){ c.fillStyle = '#EADCC0'; c.fillRect(PX+40, y, PW-80, 3); }
          c.drawImage(im[2+i], PX+46, y+22, 120, 120);
          c.fillStyle = '#786148'; c.font = '700 32px "Noto Sans JP"'; c.fillText(r[1], PX+196, y+54);
          var n = show(k, v[k]);
          c.fillStyle = '#3F6A3A'; c.font = '900 88px "Zen Maru Gothic"'; c.fillText(n, PX+194, y+140);
          if (r[2]){ var nw = c.measureText(n).width; c.font = '900 42px "Zen Maru Gothic"'; c.fillText(r[2], PX+194+nw+10, y+140); }
        });
        var oh = 420, ow = oji.width*oh/oji.height;
        c.drawImage(oji, 1080-ow-34, 1772-oh, ow, oh);
        c.font = '900 44px "Zen Maru Gothic"';
        var bw2 = c.measureText(bub).width + 72, bx = Math.max(40, 1080-ow-54-bw2), by = 1600;
        c.fillStyle = '#1F1812'; rr(c, bx+6, by+6, bw2, 104, 30); c.fill();
        c.fillStyle = '#FFFDF8'; rr(c, bx, by, bw2, 104, 30); c.fill();
        c.lineWidth = 5; c.strokeStyle = '#1F1812'; rr(c, bx+2.5, by+2.5, bw2-5, 99, 28); c.stroke();
        c.fillStyle = '#1F1812'; c.fillText(bub, bx+36, by+68);
        c.fillStyle = '#1F1812'; c.fillRect(0, 1790, 1080, 130);
        c.font = '700 40px "Noto Sans JP"';
        var p1 = 'きみも計算してみて → ', p2 = 'veganoji.jp/calculator', w1 = c.measureText(p1).width;
        c.font = '900 40px "Noto Sans JP"'; var w2 = c.measureText(p2).width, sx = 540-(w1+w2)/2;
        c.font = '700 40px "Noto Sans JP"'; c.fillStyle = '#FFF9EE'; c.fillText(p1, sx, 1868);
        c.font = '900 40px "Noto Sans JP"'; c.fillStyle = '#E8C76F'; c.fillText(p2, sx+w1, 1868);
        return new Promise(function(ok){ $('cv').toBlob(function(bl){ ok(bl); }, 'image/jpeg', .92); });
      });
    }
    function scheduleCard(){
      cardBlob = null; clearTimeout(cardTimer);
      cardTimer = setTimeout(function(){ var at = idx; drawCard().then(function(bl){ if (at === idx) cardBlob = bl; }).catch(function(){}); }, 450);
    }
    var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    function fname(){ return 'vegan-dentaku-'+labelOf(STEPS[idx])+'.jpg'; }
    function fallback(bl){
      var u = URL.createObjectURL(bl);
      if (isIOS){ $('ov-img').src = u; $('ov').setAttribute('data-open', 'true'); return; }
      var a = document.createElement('a'); a.href = u; a.download = fname(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
    }
    $('save').addEventListener('click', function(){
      var btn = this;
      if (!cardBlob){ btn.disabled = true; drawCard().then(function(bl){ btn.disabled = false; cardBlob = bl; fallback(bl); }).catch(function(){ btn.disabled = false; alert('画像をつくれませんでした。もう一度ためしてね🙏'); }); return; }
      var file = new File([cardBlob], fname(), { type:'image/jpeg' });
      if (touch && navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], text:shareText }).catch(function(e){ if (e && e.name !== 'AbortError') fallback(cardBlob); });
      } else { fallback(cardBlob); }
    });
    $('ov-close').addEventListener('click', function(){ $('ov').removeAttribute('data-open'); $('ov-img').removeAttribute('src'); });

    update();
  })();
  </script>
  <script src="/mnav.js" defer></script>
  <script src="/oji-footer.js" defer></script>
